[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = arduino

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

build_flags =
    -DSSD1306_NO_SPLASH
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
